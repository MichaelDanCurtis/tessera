[package]
name = "tessera-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
# async, object-safe SecretEngine: async-trait boxes the returned futures so the
# trait stays object-safe (Arc<dyn SecretEngine>).
async-trait = "0.1"
# Seal-file crypto for the encrypted RustyVault unseal sidecar (Phase 3):
# AES-256-GCM with the key = SHA-256(master_key). Pure-Rust RustCrypto crates
# (NIST suite — never ShangMi/SM), kept as direct deps so they don't couple to
# whatever crypto rusty_vault transitively exposes.
aes-gcm = "0.10"
sha2 = "0.10"
# RustyVault embedded engine (Task 9). `crypto_adaptor_openssl` pins the vanilla
# crates.io OpenSSL backend; `crypto_adaptor_tongsuo` (ShangMi/SM, 国密) is the
# mutually-exclusive alternative and is NEVER enabled. `default-features = false`
# so a future upstream default flip cannot silently swap the crypto backend.
# Pinned to the crates.io 0.2.1 release (NOT a git dep on main, whose workspace
# root activates a Tongsuo openssl [patch.crates-io]). See docs/spike-rustyvault.md.
rusty_vault = { version = "0.2.1", default-features = false, features = ["crypto_adaptor_openssl"] }
# Base64-encode opaque blob bytes into RustyVault's KV-v1 JSON string field.
base64ct = { version = "1", features = ["alloc"] }
# Async engine: Core::handle_request is awaited directly (no nested runtime).
# `rt-multi-thread` + `macros` enable `#[tokio::test]`; `sync` enables
# tokio::sync::{RwLock, Mutex} (the async-aware Core guard + per-path RMW lock).
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"] }
base64 = "0.22.1"
rand = "0.8"
# ed25519 signature verification for A2E ExecutionMandate trust-plane (Phase 1).
# v2.x API: VerifyingKey::from_bytes(&[u8;32]) + verify_strict(msg, &Signature).
# default-features keeps `std`; we only need verification (no signing in prod core).
ed25519-dalek = "2"
# RFC3339 window checks (issuedAt <= now <= expiresAt) in mandate.rs. Workspace
# pin already carries formatting+parsing features.
time = { workspace = true }

[dev-dependencies]
# Temp dirs for persistence tests (FileAuditSink, PolicyStore, TokenStore).
tempfile = "3"
