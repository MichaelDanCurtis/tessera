[workspace]
resolver = "2"
members = ["crates/tessera-core", "crates/tessera-server"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8"
tower = "0.5"
blake3 = "1"
rcgen = "0.13"
time = { version = "0.3", features = ["formatting", "parsing"] }
